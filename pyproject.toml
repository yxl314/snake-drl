[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "snake-drl"
version = "1.1.0"
description = "CPU batched snake engine with a modular PPO/DQN deep-RL layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "omegaconf>=2.3",
  "dacite>=1.8",
  "tqdm>=4.60",
]

[project.optional-dependencies]
play = ["PyQt6>=6.5"]
plot = ["matplotlib>=3.7", "pillow>=10"]
tensorboard = ["tensorboard>=2.13"]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.6"]

[project.scripts]
snake-drl = "snake_drl.cli:main"
snake-play = "snake_drl.play.app:main"

[tool.scikit-build]
cmake.args = [
  "-DSNAKE_BUILD_PYTHON=ON",
  "-DSNAKE_BUILD_TESTS=OFF",
  "-DSNAKE_BUILD_BENCHMARKS=OFF",
  "-DSNAKE_ENABLE_IPO=OFF",
  "-DSNAKE_ENABLE_INSTALL=OFF",
]
wheel.packages = ["python/snake_drl"]
sdist.include = ["core/", "bindings/", "configs/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:The given NumPy array is not writable:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"python/tests/*" = ["E501"]
# The PyQt6 front-end predates this style pass; reformatting it is noise.
"python/snake_drl/play/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The PyQt6 stubs shipped for this environment do not parse under mypy 2.x
# ("'/' parameter must appear before '*'"), and the Qt front-end plus the CLI
# shell that imports it are thin, untested-by-types adapters.
exclude = ["^python/snake_drl/play/", '^python/snake_drl/cli\.py$']
