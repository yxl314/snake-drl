# cxx_audit 配置 —— snake-drl 的 C++ 核心
#
# 在 core/ 目录运行：
#     PYTHONPATH=../../cxx_audit/src python3 -m cxx_audit -c audit.toml all
[project]
name = "snake-core"
root = "."
sources = ["src", "include", "tests", "benchmarks"]
excludes = ["build", ".git", "docs", "reports", "ci-logs", "test-logs", "third_party"]
build_system = "cmake"
project_file = "CMakeLists.txt"
build_dir = "build/audit"
target = "snake_core_tests"

[compat]
# 本项目明确要求 C++17；compat 规则面向 C++98，启用只会产生系统性误报。
enabled = false
rules = []

[tidy]
enabled = true
# 检查集由下面的 [tidy.groups] 组开关生成；cxx_audit 不读取项目 .clang-tidy
# （.clang-tidy 仍供 cxx-standardize 的 clang-tidy 修复与编辑器使用）。
report = "reports/clang-tidy.txt"
fail_on_warnings = true
jobs = 24
# MinGW/UCRT 的 assert 失败函数（_assert/_wassert）在头文件里没有 noreturn
# 标注，clang-analyzer 会把 assert 之后的代码当成可达路径，产生空指针解引用
# 之类的假告警。该强制包含头只给 clang 分析补声明属性；内容按 _WIN32 +
# __clang__ 收口，普通编译与 POSIX 分析都不受影响。
#
# clang-tidy 按编译数据库里的 directory（build/audit，项目根下两级）解析相对
# include 路径，所以这里用 ../../cmake；改 [project].build_dir 的深度时要同步。
extra_args = ["--extra-arg=-I../../cmake",
              "--extra-arg=-include",
              "--extra-arg=analysis_mingw_assert.h"]

[tidy.groups]
# 组内检查项由 cxx_audit 维护，升级工具时只需复核这里的开关。
#
# 选组口径：覆盖原 .clang-tidy 里实际启用的 clang-analyzer-* / bugprone-* /
# performance-* 检查，同时避开会让项目历史豁免失效或引入工具自身噪音的组：
#   - modernize / style：会把 global 关闭的 modernize-use-trailing-return-type、
#     readability-* 等一次性放出来，噪音远大于收益；
#   - integer：组内 bugprone-narrowing-conversions 正是本项目刻意豁免的项；
#   - bounds_ub：引入从未启用的 cppcoreguidelines-pro-bounds-* 检查；
#   - compiler_warnings：cxx-audit 在 Windows/MinGW 上会自行追加
#     --gcc-toolchain，clang 把这当成 unused argument（clang-diagnostic-*），
#     与项目代码无关；编译告警由构建阶段本身负责。
# 个别仍需豁免的点用 NOLINTNEXTLINE 就地标注（见 tests/）。
null_pointer = true
uninitialized = true
memory = true
lifetime = true
common_bugs = true
performance = true

[cpd]
enabled = true
dirs = ["src", "include"]
# pimpl 的公开头文件与实现头文件必然重复声明同一套 API，属于结构性重复。
# 阈值定在 100 tokens，让真正的复制粘贴仍然暴露出来。
min_tokens = 100
report = "reports/cpd.txt"

[asan]
# 当前环境是 PRoot-Distro，ASan 运行期会报
#   AddressSanitizer: CHECK failed: sanitizer_allocator_primary64.h
# 这是运行环境限制，不是代码问题。普通 Linux 主机上改回 true。
enabled = false
build_dir = "build/asan"
targets = ["snake_core_tests"]
compiler = "clang++"
cxxflags = ["-std=c++17", "-fsanitize=address",
            "-fsanitize-address-use-after-return=always",
            "-fno-omit-frame-pointer", "-g", "-O0"]
ldflags = ["-fsanitize=address"]
checks = ["detect_leaks", "detect_stack_use_after_return"]
options = { halt_on_error = "0", symbolize = "1" }
report = "reports/asan.txt"
timeout_sec = 120

[valgrind]
enabled = true
build_dir = "build/debug"
targets = ["snake_core_tests"]
compiler = "clang++"
cxxflags = ["-std=c++17", "-g", "-O0"]
tool = "memcheck"
checks = ["leaks"]
extra_args = ["--undef-value-errors=no",
              "--errors-for-leak-kinds=definite,indirect"]
report = "reports/valgrind.txt"
timeout_sec = 300

[reports]
dir = "reports"
